<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script>(function(d){d.className+=" js";try{var t=localStorage.getItem("theme");if(t=="light"||t=="dark")d.setAttribute("data-theme",t)}catch(e){}})(document.documentElement)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<title>$title</title>
<meta name="description" content="$description">
$canonical
<meta property="og:type" content="$og_type">
<meta property="og:site_name" content="Joe Kendall">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="$url">
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:image" content="https://joekendall.co.uk/og-image.jpg?v=$ogv">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Joe Kendall, developer in Manchester and founder of VerifiedReply.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="$og_title">
<meta name="twitter:description" content="$description">
<meta name="twitter:image" content="https://joekendall.co.uk/og-image.jpg?v=$ogv">
<link rel="preload" href="${up}assets/fonts/archivo.woff2?v=$v" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="${up}assets/css/site.css?v=$v">
<link rel="icon" href="${up}favicon.svg" type="image/svg+xml">
<link rel="icon" href="${up}favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="${up}apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="Joe Kendall: writing" href="${up}writing/feed.xml">
<script type="application/ld+json">
$jsonld
</script>
</head>
<body id="top">
<a class="skip" href="#main">Skip to content</a>
<div class="sheet">
<header class="top">
  <a href="${up}"$home_current>joekendall.co.uk</a>
  <nav aria-label="Site">$nav</nav>
</header>
<main id="main" tabindex="-1">
$body
</main>
<footer class="foot">
  <span>Joe Kendall, Manchester.</span>
  <div class="theme" role="group" aria-label="Theme" hidden><button type="button" data-set="light">Light</button><button type="button" data-set="dark">Dark</button></div>
  <a href="#top">Back to top</a>
</footer>
</div>
<script>
(function () {
  var lines = '.band, .rail li, .rows li, .foot';
  function draw(e) {
    for (var el = e.target; el && el.nodeType === 1; el = el.parentElement) {
      if (el.matches(lines)) el.classList.add('drawn');
    }
  }
  document.addEventListener('pointerover', draw);
  document.addEventListener('focusin', draw);
})();
(function () {
  var root = document.documentElement;
  var group = document.querySelector('.theme');
  var buttons = group.querySelectorAll('button');
  var system = matchMedia('(prefers-color-scheme: dark)');
  var metas = document.querySelectorAll('meta[name="theme-color"]');
  var ground = { light: '#fbfbfa', dark: '#1c1c1a' };
  function show() {
    var set = root.getAttribute('data-theme');
    var now = set || (system.matches ? 'dark' : 'light');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-set') === now);
    }
    for (var j = 0; j < metas.length; j++) {
      metas[j].content = set ? ground[set] : (/dark/.test(metas[j].media) ? ground.dark : ground.light);
    }
  }
  group.addEventListener('click', function (e) {
    var next = e.target.getAttribute && e.target.getAttribute('data-set');
    if (!next) return;
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (err) {}
    show();
  });
  system.addEventListener('change', show);
  group.hidden = false;
  show();
})();
</script>
</body>
</html>
